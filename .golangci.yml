run:
  timeout: 5m
  go: "1.25"
  build-tags:
    - realdeps

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - misspell
    - gofmt
    - goimports

linters-settings:
  errcheck:
    exclude-functions:
      - encoding/json.Marshal
      - encoding/json.Unmarshal
      - (*encoding/json.Encoder).Encode
      - (*encoding/json.Decoder).Decode
  goimports:
    local-prefixes: github.com/doomervibe/fleuve-go

issues:
  exclude-dirs:
    - examples
  exclude-rules:
    # Test files often intentionally skip error checks for brevity
    - path: _test\.go
      linters:
        - errcheck
